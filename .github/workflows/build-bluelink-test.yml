name: Build BlueLink test JAR

on:
  push:
    branches:
      - bluelink-cci-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test BlueLink
        run: |
          ./mvnw -B clean package \
            -pl :org.openhab.binding.bluelink

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: bluelink-cci-test
          path: |
            bundles/org.openhab.binding.bluelink/target/org.openhab.binding.bluelink-*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
            !**/*-tests.jar
          if-no-files-found: error